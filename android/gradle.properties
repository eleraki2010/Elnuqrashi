# كومة أصغر (4G) تناسب جهاز 16GB مع تطبيقات كثيرة مفتوحة — 8G كانت
# تسبب انهيار daemon عند نقص الذاكرة وقت البناء.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=6g -Dandroid.lintOptions.checkReleaseBuilds=false -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.newDsl=false
kotlin.jvm.target=17
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true